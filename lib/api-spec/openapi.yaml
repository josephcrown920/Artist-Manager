openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Rudy AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message to Rudy
      description: Send a message and receive a response from Rudy (powered by xAI Grok)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Successful response from Rudy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "500":
          description: Error communicating with AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Get chat history
      description: Get the stored chat message history
      responses:
        "200":
          description: Chat history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
    delete:
      operationId: clearChatHistory
      tags: [chat]
      summary: Clear chat history
      description: Clear all stored chat messages
      responses:
        "200":
          description: History cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearHistoryResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - role
        - content
        - timestamp
    ChatRequest:
      type: object
      properties:
        message:
          type: string
          description: The user's message to Rudy
      required:
        - message
    ChatResponse:
      type: object
      properties:
        reply:
          type: string
          description: Rudy's reply
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - reply
        - messages
    ChatHistoryResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages
    ClearHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
